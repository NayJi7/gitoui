name: Feature request
description: Something you would like gitoui to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: "How you picture it working in gitoui. Keys, views, options: anything goes."
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another tool, a git command, a script...
