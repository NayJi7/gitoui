name: Build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    strategy:
      matrix:
        versions:
          - stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.versions }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The default `cache-bin: true` caches ~/.cargo/bin, which on
          # macOS runners ends up storing `rustup-init` under the name
          # `cargo`. On restore, `cargo build` is then interpreted as
          # `rustup-init build` → "unexpected argument 'build'". Skip
          # caching the bin dir so rustup keeps its real shims.
          cache-bin: false
      - name: Version
        run: |
          rustc --version
          cargo --version
          cargo fmt -- --version
          cargo clippy -- --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --verbose

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-unknown-linux-gnu is covered by the `lint` job above —
          # skip it here to keep CI minutes manageable.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macOS — Apple Silicon runners ship both arches' SDKs, so x86_64
          # and aarch64 are both native enough for plain `cargo build`.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # See lint job — avoid the macOS cargo/rustup-init collision.
          cache-bin: false
      # cargo-zigbuild uses `zig cc` as the cross-linker. Replaces
      # `cross` which on v0.2.5 shipped Ubuntu 16-era base images whose
      # glibc was too old to run host-built build scripts of current
      # crates on ubuntu-24.04 runners.
      #
      # taiki-e/install-action has a manifest for `cargo-zigbuild` but
      # NOT for raw `zig` (would 404), so we install zig itself via
      # `goto-bus-stop/setup-zig` (the dedicated zig installer).
      - name: Install zig (Linux cross-compile only)
        if: matrix.cross
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (Linux cross-compile only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --target ${{ matrix.target }}
          else
            cargo build --target ${{ matrix.target }}
          fi
