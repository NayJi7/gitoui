name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # macOS runners stash `rustup-init` under the name `cargo`
          # in the bin cache. On restore that shadows the real cargo
          # binary, so `cargo build` errors with "unexpected argument".
          cache-bin: false
      # See build.yml comment — `zig` itself isn't in taiki-e/install-
      # action's manifest, so install via the dedicated setup-zig
      # action; cargo-zigbuild then uses it as the cross linker.
      - name: Install zig (Linux cross-compile only)
        if: matrix.cross
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (Linux cross-compile only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> ${GITHUB_ENV}
      - name: Archive
        run: tar -czf gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release gitoui
      - name: Checksum
        run: shasum -a 256 gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Checksum
        run: sha256sum releases/* > ./releases/checksum.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2.0.4
        with:
          # Publish straight away — `cargo publish` ships in parallel
          # and the install.sh one-liner needs the binaries live the
          # moment the tag exists.
          draft: false
          generate_release_notes: true
          make_latest: true
          files: |
            releases/*

  publish-crate:
    # Push the source crate to crates.io after the binaries land. Runs
    # in parallel with `release` (no needs:) — the GitHub Release and
    # the crates.io upload don't depend on each other, and a publish
    # failure must not orphan the binaries.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Cargo.toml version matches the tag
        # Refuses to publish when the bump commit was forgotten — `cargo
        # publish` would still succeed silently with the old version.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$cargo_v" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $cargo_v"
            exit 1
          fi
      - name: Publish to crates.io
        env:
          # Set CARGO_REGISTRY_TOKEN as a repository secret in
          # Settings → Secrets and variables → Actions.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
