name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # macOS runners stash `rustup-init` under the name `cargo`
          # in the bin cache. On restore that shadows the real cargo
          # binary, so `cargo build` errors with "unexpected argument".
          cache-bin: false
      - name: Install zig + cargo-zigbuild (Linux cross-compile only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          # See build.yml — `cargo-zigbuild` replaces `cross` to dodge
          # cross 0.2.5's stale glibc base images.
          tool: cargo-zigbuild,zig
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> ${GITHUB_ENV}
      - name: Archive
        run: tar -czf gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release gitoui
      - name: Checksum
        run: shasum -a 256 gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: gitoui-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Checksum
        run: sha256sum releases/* > ./releases/checksum.txt
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2.0.4
        with:
          draft: true
          generate_release_notes: true
          make_latest: true
          files: |
            releases/*
