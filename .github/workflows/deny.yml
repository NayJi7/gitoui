name: Deny

on:
  push:
    branches:
      - '*'
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
  pull_request:
    branches:
      - master
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '**/deny.toml'
  # Run weekly so newly disclosed RustSec advisories are caught even
  # when dependencies haven't changed.
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/releases/tag/v6.0.1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # https://github.com/EmbarkStudios/cargo-deny-action/releases/tag/v2.0.18
      - uses: EmbarkStudios/cargo-deny-action@a531616d8ce3b9177443e48a1159bc945a099823
        with:
          # Run both license and advisory (RustSec / CVE) checks.
          command: check licenses advisories
