name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/gh-pages.yml"
      # Hosted assets that the docs site syncs from the repo root via
      # the `sync-public` npm script. A change to either re-deploys
      # /gitoui/install.sh and /gitoui/brand/<name>.svg.
      - "install.sh"
      - "assets/brand/**"
      # SiteTitle.astro reads the workspace version from Cargo.toml at
      # build time (via Vite's `?raw` import). A bump must trigger a
      # redeploy or the header tag stays stuck on the previous release.
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build with Astro
        working-directory: docs
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
