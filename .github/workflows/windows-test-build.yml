name: Windows test build

# A release build of the windows branch, to try it on a real Windows machine
# without installing Rust: download the artifact of the run, unzip, run.
# Remove this workflow once Windows ships in a release.
on:
  push:
    branches:
      - windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: gitoui-windows-x86_64
          path: target/release/gitoui.exe
          if-no-files-found: error
          retention-days: 14
