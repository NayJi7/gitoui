# Dev-dependencies are never shipped to users: `text-to-png` (tests/graph.rs
# only) pulls resvg 0.45 + rustybuzz + ttf-parser, both flagged unmaintained
# (RUSTSEC-2026-0206, RUSTSEC-2026-0192) with no replacement. Audit the
# runtime graph only.
[graph]
exclude-dev = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

# Scan dependencies against the RustSec advisory database (CVE feed).
# Equivalent to running `cargo audit` but via cargo-deny so we keep a
# single tool and a single config in CI.
[advisories]
version = 2
yanked = "warn"
# Unmaintained-crate advisories with no safe upgrade path. Each one is
# pulled in by a transitive dependency we don't own; revisit on every
# `cargo update` to see whether the upstream chain has moved off them.
ignore = [
    "RUSTSEC-2025-0141", # bincode - unmaintained; pulled in via syntect
    "RUSTSEC-2024-0320", # yaml-rust - unmaintained; via syntect (no upgrade)
    # chrono is NOT vulnerable: its maintainer soft-deprecated it
    # (https://github.com/chronotope/chrono/issues/1768) and recommends jiff,
    # and the advisory only says "unmaintained, all versions affected". It is
    # a DIRECT dependency (the date of every commit, the bincode commit cache,
    # the graph snapshot tests), so leaving it is a dedicated migration to
    # jiff (1.0 shipped on 2026-11-15) with a cache format bump, not a quick
    # swap. The id is ignored, not the crate: a real vulnerability in chrono
    # would carry another id and still fail the check. Revisit when the jiff
    # migration lands, then delete this line.
    { id = "RUSTSEC-2026-0543", reason = "chrono is soft-deprecated, not vulnerable; migrating to jiff is a dedicated refactor" },
]
