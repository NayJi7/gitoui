[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

# Scan dependencies against the RustSec advisory database (CVE feed).
# Equivalent to running `cargo audit` but via cargo-deny so we keep a
# single tool and a single config in CI.
[advisories]
version = 2
yanked = "warn"
# Unmaintained-crate advisories with no safe upgrade path. Each one is
# pulled in by a transitive dependency we don't own; revisit on every
# `cargo update` to see whether the upstream chain has moved off them.
ignore = [
    "RUSTSEC-2025-0056", # adler — unmaintained; pulled in via miniz_oxide
    "RUSTSEC-2025-0141", # bincode — unmaintained; pulled in via syntect
    "RUSTSEC-2024-0320", # yaml-rust — unmaintained; via syntect (no upgrade)
]
