[package]
name = "gitoui"
version = "0.3.0"
description = "Say oui to the smoothest git terminal youser experience"
authors = ["NayJi7 <naayji7@gmail.com>"]
homepage = "https://github.com/NayJi7/gitoui"
repository = "https://github.com/NayJi7/gitoui"
readme = "README.md"
license = "MIT"
keywords = ["git", "cli", "tui", "terminal"]
categories = ["command-line-utilities"]
edition = "2021"
rust-version = "1.88.0"

exclude = ["/.github", "/assets/readme"]

[dependencies]
ansi-to-tui = "8.0.1"
regex = "1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.22.1"
dirs = "6"
md-5 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
fuzzy-matcher = "0.3.7"
garde = { version = "0.22.1", features = ["derive", "regex"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
resvg = { version = "0.47", default-features = false }
laurier = "0.3.0"
lru = "0.12"
once_cell = "1.21.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.0", features = ["serde"] }
rustc-hash = "2.1.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syntect = "5"
smart-default = "0.7.1"
toml = "1.1.2"
tui-input = "0.15.3"
tui-tree-widget = "0.24.0"
umbra = "0.4.0"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
notify-debouncer-mini = { version = "0.7.0", default-features = false }
thiserror = "2"
bincode = "1"

[dev-dependencies]
dircpy = "0.3.20"
rstest = "0.26.1"
tempfile = "3.27.0"
text-to-png = "0.3.0"

[profile.release]
codegen-units = 1
lto = true
